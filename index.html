<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de Dados da Planilha</title>
  
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f4f6f8;
      color: #333;
    }

    h1 {
      color: #2c3e50;
      margin-bottom: 20px;
    }

    /* Permite rolagem horizontal para ver todas as 54 colunas */
    #resultado {
      overflow-x: auto;
      max-width: 100%;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      white-space: nowrap; /* Evita que o texto quebre linhas na tabela */
    }

    th, td {
      padding: 10px 14px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #3498db;
      color: white;
      text-transform: uppercase;
      font-size: 13px;
    }

    tr:hover {
      background-color: #f1f1f1;
    }

    .erro {
      color: #e74c3c;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Base Elite Clientes</h1>
  <div id="resultado">Carregando dados da planilha...</div>

  <script src="app.js"></script>
</body>
</html>
