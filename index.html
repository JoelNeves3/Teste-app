<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base Elite Clientes - Dashboard</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background-color: #f4f6f8; padding: 20px; color: #333; }
    .container { max-width: 100%; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 10px; flex-wrap: wrap; }
    input { padding: 10px; width: 300px; max-width: 100%; border: 1px solid #ccc; border-radius: 4px; outline: none; }
    button { padding: 10px 16px; border: 0; border-radius: 4px; background: #2c3e50; color: #fff; cursor: pointer; font: inherit; }
    .table-container { overflow-x: auto; max-height: 70vh; }
    table { width: 100%; border-collapse: collapse; white-space: nowrap; font-size: 13px; }
    th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background: #2c3e50; color: #fff; position: sticky; top: 0; z-index: 10; }
    tr:hover { background-color: #f1f1f1; }
    .erro { color: #e74c3c; font-weight: bold; padding: 20px; text-align: center; white-space: normal; line-height: 1.5; }
    #contador { margin-left: 8px; color: #666; font-size: 13px; }
    #tokenBox { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; padding: 14px; background: #eef2f6; border-radius: 6px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Base Elite Clientes</h1>
      <div>
        <input type="text" id="inputBusca" placeholder="Pesquisar por nome, CNPJ, e-mail...">
        <span id="contador">0 registros</span>
      </div>
    </header>

    <div id="tokenBox" hidden>
      <span>Digite o código de acesso (fica salvo neste navegador):</span>
      <input type="password" id="wtoken" placeholder="Código de acesso">
      <button id="wtokenOk" type="button">Conectar</button>
    </div>

    <div id="resultado" class="table-container">Carregando dados da planilha...</div>
  </div>

  <script>
    // ===== Configuração =====
    // Link do App da Web do Apps Script (termina em /exec).
    // O código de acesso NÃO vai aqui: cada pessoa digita uma vez e ele fica salvo no navegador dela.
    const WEBAPP_URL = 'COLE_AQUI_O_LINK_EXEC';

    // ===== Leitura via App da Web (JSONP) =====
    function jsonp(url, ms = 60000) {
      return new Promise((resolve, reject) => {
        const cb = 'cbBase_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
        const s = document.createElement('script');
        const fim = () => { clearTimeout(t); try { delete window[cb]; } catch (e) { window[cb] = undefined; } s.remove(); };
        const t = setTimeout(() => { fim(); reject(new Error('O serviço de dados não respondeu. Tente de novo em instantes.')); }, ms);
        window[cb] = d => { fim(); resolve(d); };
        s.onerror = () => { fim(); reject(new Error('Não consegui acessar o serviço de dados. Confira o WEBAPP_URL e se o App da Web está implantado com acesso para "Qualquer pessoa".')); };
        s.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;
        document.body.appendChild(s);
      });
    }

    function pedirToken(msg) {
      $('#tokenBox').hidden = false;
      $('#wtoken').focus();
      $('#resultado').innerHTML = `<p class="erro">${esc(msg || 'Digite o código de acesso para ver os dados.')}</p>`;
    }

    async function carregar() {
      let tok = null; try { tok = localStorage.getItem('baseEliteToken'); } catch (e) {}
      if (!tok) { pedirToken(); return null; }
      const d = await jsonp(`${WEBAPP_URL}?token=${encodeURIComponent(tok)}`);
      if (!d || !d.ok) {
        if (d && d.erro === 'token') { try { localStorage.removeItem('baseEliteToken'); } catch (e) {} pedirToken('Código de acesso inválido. Digite novamente.'); return null; }
        throw new Error('Serviço de dados: ' + ((d && d.mensagem) || 'resposta inválida.'));
      }
      $('#tokenBox').hidden = true;
      ATUALIZADO_EM = d.atualizado_em || '';
      return d.linhas || [];
    }

    // ===== Tabela e busca =====
    let CABECALHO = [], DADOS = [], ATUALIZADO_EM = '';
    const $ = s => document.querySelector(s);
    const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const norm = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

    function prepararDados(linhas) {
      const uteis = linhas.filter(l => l.some(c => String(c).trim() !== ''));
      if (!uteis.length) throw new Error('A planilha está vazia.');
      let nCols = 0;
      uteis.forEach(l => l.forEach((c, i) => { if (String(c).trim() !== '') nCols = Math.max(nCols, i + 1); }));
      CABECALHO = uteis[0].slice(0, nCols).map((h, i) => String(h).trim() || `Coluna ${i + 1}`);
      DADOS = uteis.slice(1).map(l => {
        const cel = Array.from({ length: nCols }, (_, i) => l[i] ?? '');
        const texto = norm(cel.join(' | '));
        return { cel, busca: texto, digitos: texto.replace(/\D/g, '') };
      });
    }

    function render() {
      const termo = norm($('#inputBusca').value.trim());
      const termoDig = termo.replace(/\D/g, '');
      const lista = !termo ? DADOS : DADOS.filter(d =>
        d.busca.includes(termo) || (termoDig.length >= 3 && termoDig === termo.replace(/[.\-\/\s]/g, '') && d.digitos.includes(termoDig))
      );
      $('#contador').textContent = (termo
        ? `${lista.length.toLocaleString('pt-BR')} de ${DADOS.length.toLocaleString('pt-BR')} registros`
        : `${DADOS.length.toLocaleString('pt-BR')} registros`) + (ATUALIZADO_EM ? ` · atualizado em ${ATUALIZADO_EM}` : '');

      if (!lista.length) { $('#resultado').innerHTML = '<p class="erro">Nenhum registro encontrado.</p>'; return; }
      const th = CABECALHO.map(h => `<th>${esc(h)}</th>`).join('');
      const trs = lista.map(d => `<tr>${d.cel.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('');
      $('#resultado').innerHTML = `<table><thead><tr>${th}</tr></thead><tbody>${trs}</tbody></table>`;
    }

    async function iniciar() {
      $('#resultado').textContent = 'Carregando dados da planilha...';
      try {
        const linhas = await carregar();
        if (!linhas) return;
        prepararDados(linhas);
        render();
      } catch (e) {
        $('#contador').textContent = '0 registros';
        $('#resultado').innerHTML = `<p class="erro">${esc(e.message)}</p>`;
      }
    }

    // ===== Início =====
    document.addEventListener('DOMContentLoaded', () => {
      let t;
      $('#inputBusca').addEventListener('input', () => { clearTimeout(t); t = setTimeout(render, 200); });
      // aceita ?token=... no link (salva e limpa da barra de endereço)
      const p = new URLSearchParams(location.search);
      if (p.get('token')) { try { localStorage.setItem('baseEliteToken', p.get('token')); } catch (e) {} p.delete('token'); history.replaceState(null, '', location.pathname + (p.toString() ? '?' + p : '')); }
      $('#wtokenOk').onclick = () => { const v = $('#wtoken').value.trim(); if (!v) return; try { localStorage.setItem('baseEliteToken', v); } catch (e) {} $('#wtoken').value = ''; iniciar(); };
      $('#wtoken').onkeydown = ev => { if (ev.key === 'Enter') $('#wtokenOk').click(); };
      iniciar();
    });
  </script>
</body>
</html>
